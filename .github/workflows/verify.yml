name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Angular build and tests
        run: npm ci && npm run build && npm test -- --watch=false
        working-directory: frontend
      - name: Angular strict type checks
        run: npx tsc --noEmit -p tsconfig.app.json && npx tsc --noEmit -p tsconfig.spec.json
        working-directory: frontend
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, xml
      - name: Laravel SQLite and formatting
        run: composer install --no-interaction && php vendor/bin/pint --test && php vendor/bin/phpunit --do-not-cache-result
        working-directory: backend

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: familyguard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: familyguard_ci_only
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_DATABASE: familyguard_test
      DB_HOST: 127.0.0.1
      DB_PORT: '5433'
      DB_USERNAME: postgres
      DB_PASSWORD: familyguard_ci_only
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, pdo_pgsql, mbstring, xml
      - name: Laravel PostgreSQL including process races
        run: composer install --no-interaction && php vendor/bin/phpunit --do-not-cache-result
        working-directory: backend

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Android APKs lint and JVM tests
        run: bash ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest
        working-directory: apps/child-android
      - name: Preserve Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          retention-days: 7
          path: |
            apps/child-android/app/build/reports/tests/testDebugUnitTest/
            apps/child-android/app/build/test-results/testDebugUnitTest/
            apps/child-android/app/build/reports/lint-results-debug.*
